<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carton Tracker App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; margin-top: 10px; display: block; }
        input, textarea, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            border: none;
            margin-top: 15px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        .carton-card {
            background: #eef2f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 5px solid #007bff;
        }
        .carton-card img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 5px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 কার্টন ট্র্যাকার</h2>
    
    <form id="cartonForm">
        <label>কার্টন নম্বর / নাম:</label>
        <input type="text" id="cartonNo" placeholder="যেমন: Carton-01" required>

        <label>প্রোডাক্টের বিবরণ (কী কী আছে):</label>
        <textarea id="productDetails" rows="3" placeholder="যেমন: 10 Shirts, 5 Pants" required></textarea>

        <label>স্টোর রুমের নাম / নম্বর:</label>
        <input type="text" id="storeRoom" placeholder="যেমন: Store Room B" required>

        <label>কার্টনের ছবি (অপশনাল):</label>
        <input type="file" id="cartonImg" accept="image/*">

        <button type="submit">কার্টন সেভ করুন</button>
    </form>

    <hr style="margin-top: 25px;">
    <h3>পাঠানো কার্টনের তালিকা</h3>
    <div id="cartonList"></div>
</div>

<script>
    const form = document.getElementById('cartonForm');
    const cartonList = document.getElementById('cartonList');

    let savedCartons = JSON.parse(localStorage.getItem('cartons')) || [];

    function renderCartons() {
        cartonList.innerHTML = '';
        savedCartons.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'carton-card';
            card.innerHTML = `
                <h4>📦 ${item.cartonNo}</h4>
                <p><strong>প্রোডাক্ট:</strong> ${item.productDetails}</p>
                <p><strong>গন্তব্য:</strong> ${item.storeRoom}</p>
                <p><small>তারিখ: ${item.date}</small></p>
                ${item.image ? `<img src="${item.image}">` : ''}
            `;
            cartonList.prepend(card);
        });
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const cartonNo = document.getElementById('cartonNo').value;
        const productDetails = document.getElementById('productDetails').value;
        const storeRoom = document.getElementById('storeRoom').value;
        const imgInput = document.getElementById('cartonImg');

        let imageData = "";

        const saveData = (img) => {
            const newCarton = {
                cartonNo,
                productDetails,
                storeRoom,
                image: img,
                date: new Date().toLocaleString('bn-BD')
            };
            savedCartons.push(newCarton);
            localStorage.setItem('cartons', JSON.stringify(savedCartons));
            renderCartons();
            form.reset();
        };

        if (imgInput.files && imgInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                saveData(e.target.result);
            };
            reader.readAsDataURL(imgInput.files[0]);
        } else {
            saveData("");
        }
    });

    renderCartons();
</script>

</body>
</html>
