<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কার্টন ট্র্যাকিং লিস্ট</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, textarea, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        input[type="text"] { flex: 1; min-width: 150px; }
        textarea { flex: 2; min-width: 200px; height: 38px; resize: none; }
        input[type="file"] { flex: 1; min-width: 180px; }
        button {
            background-color: #28a745;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            padding: 10px 20px;
        }
        button:hover { background-color: #218838; }

        /* টেবিল স্টাইল */
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 10px;
            text-align: center;
            vertical-align: middle;
        }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .product-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .no-img { color: #888; font-style: italic; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 কার্টন এন্ট্রি ও ট্র্যাকিং সিস্টেম</h2>

    <!-- ডেটা এন্ট্রি ফর্ম -->
    <form id="cartonForm" class="form-group">
        <input type="text" id="cartonNo" placeholder="কার্টন নম্বর (যেমন: C-101)" required>
        <textarea id="productDetails" placeholder="প্রোডাক্ট ডিটেইলস (কী কী আছে)" required></textarea>
        <input type="file" id="cartonImg" accept="image/*">
        <button type="submit">যোগ করুন</button>
    </form>

    <!-- ট্র্যাকিং টেবিল -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th style="width: 10%;">সিরিয়াল</th>
                    <th style="width: 20%;">কার্টন নম্বর</th>
                    <th style="width: 45%;">প্রোডাক্ট ডিটেইলস</th>
                    <th style="width: 25%;">ছবি</th>
                </tr>
            </thead>
            <tbody id="cartonTableBody">
                <!-- ডায়নামিকভাবে নতুন সারি যুক্ত হবে -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const form = document.getElementById('cartonForm');
    const tableBody = document.getElementById('cartonTableBody');

    // লোকাল স্টোরেজ থেকে সেভ হওয়া ডেটা পড়া
    let cartons = JSON.parse(localStorage.getItem('cartonRecords')) || [];

    // টেবিলে ডেটা দেখানোর ফাংশন
    function renderTable() {
        tableBody.innerHTML = '';
        cartons.forEach((item, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${index + 1}</strong></td>
                <td>${item.cartonNo}</td>
                <td style="text-align: left;">${item.productDetails}</td>
                <td>
                    ${item.image ? `<img src="${item.image}" class="product-img" alt="Carton Image">` : '<span class="no-img">ছবি নেই</span>'}
                </td>
            `;
            tableBody.appendChild(row);
        });
    }

    // নতুন কার্টন জমা দেওয়া
    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const cartonNo = document.getElementById('cartonNo').value;
        const productDetails = document.getElementById('productDetails').value;
        const imgInput = document.getElementById('cartonImg');

        const saveRecord = (imgBase64) => {
            const newEntry = {
                cartonNo: cartonNo,
                productDetails: productDetails,
                image: imgBase64
            };
            cartons.push(newEntry);
                localStorage.setItem('cartonRecords', JSON.stringify(cartons));
            renderTable();
            form.reset();
        };

        if (imgInput.files && imgInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                saveRecord(e.target.result);
            };
            reader.readAsDataURL(imgInput.files[0]);
        } else {
            saveRecord("");
        }
    });

    // পেজ লোড হলে টেবিল রেন্ডার হবে
    renderTable();
</script>

</body>
</html>
